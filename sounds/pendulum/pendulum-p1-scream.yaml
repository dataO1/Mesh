lane:
  hpf: 80
  generator:
    register: 0.5
    density: 0.5
    complexity: 0.0
    variation: 0.0
    spread: 0.0
    motif_chords: 0
    motif_exact: 1
  fx:
  - id: multiband
    source: native
    dry_wet: 0.5
    settings:
      split_1: 120
      split_2: 400
      split_3: 2000
      split_4: 5000
      split_5: 9000
      band_2_down_ratio: 1.5
      band_2_down_threshold: -18
      band_2_up_ratio: 3
      band_2_up_threshold: -45
      band_3_down_ratio: 4
      band_3_down_threshold: -28
      band_3_up_ratio: 4
      band_3_up_threshold: -45
      band_4_down_ratio: 4
      band_4_down_threshold: -28
      band_4_up_ratio: 4
      band_4_up_threshold: -45
      band_5_down_ratio: 4
      band_5_down_threshold: -34
      band_5_up_ratio: 1.0
      band_5_up_threshold: -50
      up_gate: -65
      up_max: 8
      band_6_down_ratio: 4
      band_6_down_threshold: -36
  - id: compressor
    source: native
    settings:
      threshold: -18
      ratio: 8
      attack: 0.3
      release: 50
      knee: 2
      makeup: 4
  - id: eq
    source: native
    settings:
      low_cut: 80
      bell_1_freq: 1000
      bell_1_gain: -4
      bell_1_q: 1.2
      bell_2_freq: 5000
      bell_2_gain: 1.0
      bell_2_q: 0.7
  - id: clipper
    source: native
    settings:
      threshold: 0
      knee: 3
  controls:
  - label: dens
    target:
      type: generator
      param: density
    default: 0.5
    also:
    - target:
        type: instrument
        param: 3
      min: 0
      max: 0.8
  - label: len
    target:
      type: instrument
      param: 1
    default: 0.6
  - label: rhy
    target:
      type: generator
      param: complexity
    default: 0.0
    also:
    - target:
        type: instrument
        param: 2
      min: 0
      max: 0.7
  - label: morph
    target:
      type: instrument
      param: 0
    default: 0.4
