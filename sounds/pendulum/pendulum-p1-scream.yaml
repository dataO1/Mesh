notes: "P1 v3, Pendulum drop riff voice: aggressive, thick, wide, never static.\nUser, round 1b: \"static, relatively\
  \ mono, no depth, not enough stacking, not enough\ndetune, not enough macro or micro modulation, no nice timbre,\
  \ not distorted enough,\nthe fundamental sounds almost like a violin, not aggressive at all.\"\nScene A (core,\
  \ centred): a 9-voice detuned saw (Modern osc) at the played octave, a\nformant saw table one octave up (5 voices,\
  \ wide detune, morph moving per note), a\nsquare one octave down for a hollow, hard fundamental (not a violin),\
  \ ring mod 1x2 for\nmetallic edge. Ladder filter with a punchy envelope, a westfold waveshaper whose\ndrive moves\
  \ per note. Insert: heavy fuzz waveshaper with a post high cut, then an EQ\nthat fills 250 Hz and adds a little\
  \ 800 Hz bite (round 2: the 300 Hz scoop left a hole).\nScene B (width): a 16-voice saw stack an octave up, high-passed,\
  \ through Ensemble;\nonly the top is wide, the core stays mono.\nMicro modulation: random (noise LFO) per note\
  \ on the formant morph, the fold drive and\nthe pan; a 30 ms pitch blip on every note; delayed vibrato on long\
  \ notes; velocity on\ncutoff.\nMacros: Morph (M1, dark -> screaming: cutoff, fold, fuzz, formant, ring, width\
  \ layer),\nLength (M2, stab -> held), Rhythm (M3, 1/16 gate on the filter, faster random),\nBite (M4, width layer\
  \ and detune).\nCPU: 9 + 5 + 1 + 16 unison voices; trim for the board if needed.\n\n  v4 (round 2 feedback: \"\
  an octave too low or just too dull\"; \"i dont hear any modulation\n  over time at all\"): register up an octave,\
  \ brighter filter, and modulation that moves\n  over bars, not only per note: FM (osc 2 -> osc 1) with its depth\
  \ on a dotted-8th LFO,\n  the filter envelope and the morph macro; scene LFOs free-running over 2 bars (filter,\n\
  \  formant morph, width layer) and 8 bars (fold and fuzz drive); slow random drift on the\n  unison detune; a\
  \ 1/16 filter pulse always a little on (more with Rhythm); chorus on the\n  core, phaser on the width layer; deeper\
  \ vibrato.\n\n  v4.1 (round 3: \"much much much better ... maybe a little too much distortion, but the\n  general\
  \ pocket it sits in is correct\"): fold drive 8 -> 5 dB, fuzz drive 12 -> 8 dB.\n\n  v5 (round 4: \"distortion\
  \ algorithm ... too much like static\", \"too much still\",\n  \"leads into heavy distortion often benefit from\
  \ a high feedback filter\", \"release ...\n  sounds cut off\", \"final eq ... brings up the highs around 3-8k\
  \ ... and a steep low cut\n  just under the fundamental after the distortion\"): filter config Serial 1 (ladder\
  \ ->\n  waveshaper -> filter 2). Ladder resonance 65 % drives the waveshaper (now zamsat, a smooth\n  tape-like\
  \ saturation, 3 dB instead of westfold 5 dB). Filter 2 is a 24 dB high-pass that\n  follows the played note (keytrack\
  \ 100 %), just under the fundamental, after the\n  saturation. Inserts: EQ lifting 3-8 kHz before the distortion,\
  \ then OJD overdrive\n  (smooth, 5 dB, instead of fuzz 8 dB) with its post low cut at 80 Hz, then chorus.\n  Amp\
  \ release 50 -> 250 ms (Length adds up to x4). Final lane EQ: +2.5 dB shelf-like\n  bell at 5 kHz.\n\n  v5.1 (round\
  \ 5: \"an obnoxious 8k or lasery sound, probably the feedback filter, it also\n  sounds a little like delay ...\
  \ overall the sound sounds much better and not so broken\"):\n  ladder resonance 65 -> 35 % (Morph adds up to\
  \ +15 %), filter envelope 30 -> 16 st so the\n  resonant peak no longer zaps up to ~11 kHz on every note; chorus\
  \ feedback 50 -> 0 %,\n  mix 35 -> 25 % (the delay-like smear).\n\n  v5.2 (round 6: \"still this delayish kind\
  \ of sound ... washy ... chorus usually 10 ms or so,\n  very very low feedback and 20 % mix\"): chorus time 10\
  \ ms, rate 0.8 Hz, depth 25 %,\n  feedback 5 %, mix 20 %; the width layer's Ensemble (slow BBD at 100 % depth,\
  \ also washy)\n  down to 30 / 20 % depth.\n\n  v5.3 (round 7: \"theres still this lasery sound, its probably the\
  \ ensemble\"): Ensemble removed\n  from the width layer.\n"
